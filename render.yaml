services:
  - type: web
    name: phishlab-platform
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --config gunicorn.conf.py app:app
    healthCheckPath: /healthz
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: phishlab-postgres
          property: connectionString
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: BASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: UPLOAD_FOLDER
        value: /var/data/demonstration_uploads
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_THREADS
        value: "8"
    disk:
      name: phishlab-data
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: phishlab-postgres
    plan: free
    region: oregon
    databaseName: phishlab
    user: phishlab_user
