{% extends "base.html" %}
{% block title %}Edit Campaign{% endblock %}
{% block content %}
<h2>Edit Campaign: {{ campaign.name }}</h2>
<form method="post">
    {{ form.hidden_tag() }}
    <div>{{ form.name.label }} {{ form.name() }}</div>
    <div>{{ form.description.label }} {{ form.description() }}</div>
    <div>{{ form.submit() }}</div>
</form>
{% endblock %}
