{% extends "base.html" %}
{% block title %}Delete Campaign{% endblock %}
{% block content %}
<h2>Delete Campaign: {{ campaign.name }}</h2>
<p>Are you sure you want to delete this campaign? This action cannot be undone.</p>
<form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{{ url_for('campaign_detail', cid=campaign.id) }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
