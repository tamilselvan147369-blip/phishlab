{% extends "base.html" %}
{% block title %}Demo Page{% endblock %}
{% block content %}
<h2>Demo for {{ exercise.platform|title }} ({{ exercise.campaign.name }})</h2>
<p>Below is the simulated content. Please give consent to proceed.</p>
<form method="post" action="{{ url_for('realapp.confirm_participation', token=token) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    <input type="hidden" name="participant_uuid" value="{{ participant_uuid }}" />
    <div class="form-check">
        <input class="form-check-input" type="checkbox" name="consent" id="consent" required />
        <label class="form-check-label" for="consent">I consent to participate in this security exercise.</label>
    </div>
    <button type="submit" class="btn btn-primary mt-2">Continue</button>
</form>
{% endblock %}
